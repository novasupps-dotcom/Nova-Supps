# Nova Negocio · cada vez que llega una versión a GitHub (rama master):
# 1) corre todas las pruebas, y si pasan
# 2) la publica por internet (EAS Update, canal "preview") y los teléfonos se actualizan solos.
# Si una prueba falla, NO se publica nada y los teléfonos siguen con la versión anterior.
# Configuración única: docs/ACTUALIZACIONES_AUTOMATICAS.md (secreto EXPO_TOKEN).

name: Actualizar teléfonos

on:
  push:
    branches: [master]
    paths:
      - "App.tsx"
      - "index.ts"
      - "src/**"
      - "assets/**"
      - "app.json"

jobs:
  Pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: pip install openpyxl

      - name: Ejecutar pruebas del sistema
        run: node tests/v17.cjs
